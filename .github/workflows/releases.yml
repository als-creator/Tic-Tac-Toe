name: Build and Publish Desktop Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  # ====== СБОРКА WINDOWS EXE ======
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "icon.ico;." --icon "icon.ico" main.py

      - name: Compress Release Archive (ZIP)
        shell: powershell
        run: |
          Compress-Archive -Path dist/main/* -DestinationPath tic-tac-toe-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: tic-tac-toe-windows.zip

  # ====== СБОРКА LINUX APPIMAGE ======
  build-linux:
    runs-on: ubuntu-22.04  # Используем стабильный LTS образ
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 binutils file

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "icon.ico:." main.py

      - name: Install AppImage Tooling (No FUSE required)
        run: |
          # Скачиваем нативный апптул, который работает внутри Docker/VM напрямую без FUSE
          sudo wget -O /usr/local/bin/appimagetool https://github.com
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Create AppImage Structure
        run: |
          mkdir -p TicTacToe.AppDir
          cp -r dist/main/* TicTacToe.AppDir/
          
          # Настраиваем метаданные для AppImage
          echo -e "[Desktop Entry]\nName=TicTacToe\nExec=main\nIcon=icon\nType=Application\nCategories=Game;" > TicTacToe.AppDir/TicTacToe.desktop
          cp icon.ico TicTacToe.AppDir/icon.ico
          
          # Точка входа
          echo -e "#!/bin/sh\nHERE=\$(dirname \$(readlink -f \"\$0\"))\nEXEC=\"\$HERE/main\"\nexec \"\$EXEC\" \"\$@\"" > TicTacToe.AppDir/AppRun
          chmod +x TicTacToe.AppDir/AppRun
          
          # Собираем с флагом --appimage-extract-and-run, чтобы обойти отсутствие FUSE
          export APPIMAGE_EXTRACT_AND_RUN=1
          /usr/local/bin/appimagetool --appimage-extract-and-run TicTacToe.AppDir/ tic-tac-toe-linux.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: tic-tac-toe-linux.AppImage

  # ====== ПУБЛИКАЦИЯ РЕЛИЗА НА GITHUB ======
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-releases@v2
        with:
          files: |
            tic-tac-toe-windows.zip
            tic-tac-toe-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
