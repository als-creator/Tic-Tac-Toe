name: Build and Publish Desktop Releases

on:
  push:
    tags:
      - "v*"

jobs:
  # ====== СБОРКА WINDOWS EXE ======
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "icon.ico;." --icon "icon.ico" main.py

      - name: Rename Artifact (Windows-friendly)
        shell: bash # Явно заставляем шаг использовать bash, чтобы команда mv сработала на Windows
        run: |
          mv dist/main.exe ./tic-tac-toe-windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: tic-tac-toe-windows.exe

  # ====== СБОРКА LINUX BINARY ======
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 binutils

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "icon.ico:." main.py

      - name: Create Archive
        run: |
          mv dist/main ./tic-tac-toe-linux
          tar -czvf tic-tac-toe-linux.tar.gz tic-tac-toe-linux icon.ico

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: tic-tac-toe-linux.tar.gz

  # ====== ПУБЛИКАЦИЯ РЕЛИЗА НА GITHUB ======
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-releases@v2
        with:
          files: |
            tic-tac-toe-windows.exe
            tic-tac-toe-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
