name: Build and Publish Desktop Releases

on:
  push:
    tags:
      - 'v*'

env:
  ICON_PNG: icon.png
  ICON_ICO: icon.ico

jobs:
  # ====== СБОРКА WINDOWS EXE ======
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Compute version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install C compiler (MinGW) and Nuitka
        run: |
          choco install mingw -y --no-progress
          python -m pip install --upgrade pip
          pip install nuitka

      - name: Build single EXE with Nuitka (native compile)
        shell: bash
        run: |
          python -m nuitka --standalone --onefile --mingw64 \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --windows-console-mode=disable \
            --windows-icon-from-ico="${{ env.ICON_ICO }}" \
            --include-data-file="${{ env.ICON_PNG }}=icon.png" \
            --windows-company-name="Tic-Tac-Toe" \
            --windows-product-name="Tic-Tac-Toe" \
            --windows-file-description="Крестики-нолики - игра на Python/Tk (Nuitka)" \
            --windows-product-version=${{ steps.ver.outputs.version }} \
            --windows-file-version=${{ steps.ver.outputs.version }} \
            --output-filename="tic-tac-toe-windows-${{ steps.ver.outputs.version }}.exe" \
            --output-dir="dist-windows" \
            main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist-windows/tic-tac-toe-windows-*.exe
          if-no-files-found: error

  # ====== СБОРКА LINUX APPIMAGE (PyInstaller + linuxdeploy) ======
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install system dependencies (Tk + AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 file fuse3 desktop-file-utils
          sudo apt-get install -y tk8.6 tcl8.6 libtk8.6 libtcl8.6 || true

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build AppDir files with PyInstaller (onedir)
        run: |
          # onedir нужен, чтобы linuxdeploy увидел ELF-зависимости (libtk/libtcl/X11)
          pyinstaller --noconfirm --onedir --windowed \
            --add-data "${{ env.ICON_PNG }}:." \
            --add-data "${{ env.ICON_ICO }}:." \
            --name "tic-tac-toe" main.py

      - name: Assemble AppDir structure
        run: |
          set -e
          APPDIR="$(mktemp -d)/TicTacToe.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp -a dist/tic-tac-toe/* "$APPDIR/usr/bin/"

          # desktop-файл
          { printf '%s\n' \
              '[Desktop Entry]' \
              'Type=Application' \
              'Name=Tic-Tac-Toe' \
              'Name[ru]=Крестики-нолики' \
              'Comment=Tic-Tac-Toe game' \
              'Comment[ru]=Игра «Крестики-нолики»' \
              'Exec=tic-tac-toe' \
              'Icon=tic-tac-toe' \
              'Terminal=false' \
              'Categories=Game;' \
              'StartupNotify=true' \
            > "$APPDIR/usr/share/applications/tic-tac-toe.desktop"; }

          # AppRun -> запускаем настоящий бинарь
          { printf '%s\n' \
              '#!/bin/sh' \
              'SELF="$(readlink -f -- "$0")"' \
              'HERE="${SELF%/*}"' \
              'export LD_LIBRARY_PATH="${HERE}/usr/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
              'exec "${HERE}/usr/bin/tic-tac-toe" "$@"' \
            > "$APPDIR/AppRun"; }
          chmod +x "$APPDIR/AppRun"
          chmod +x "$APPDIR/usr/bin/tic-tac-toe"

          # иконки — linuxdeploy принимает только валидные hicolor-размеры,
          # исходный icon.png 250x250 невалиден -> ресайзим до 512x512
          python -c "from PIL import Image; im=Image.open('${{ env.ICON_PNG }}'); im=im.resize((512,512), Image.LANCZOS); im.save('icon-512.png'); print('resized to', im.size)"
          cp icon-512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/tic-tac-toe.png"
          cp icon-512.png "$APPDIR/tic-tac-toe.png"

          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"

      - name: Download linuxdeploy
        run: |
          wget -q -O /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy

      - name: Generate AppImage with linuxdeploy
        run: |
          export ARCH=x86_64
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/linuxdeploy \
            --appdir "$APPDIR" \
            --desktop-file "$APPDIR/usr/share/applications/tic-tac-toe.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/512x512/apps/tic-tac-toe.png" \
            --output appimage
          mv Tic-Tac-Toe-x86_64.AppImage ./tic-tac-toe-linux-${{ steps.ver.outputs.version }}.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: tic-tac-toe-linux-*.AppImage
          if-no-files-found: error

  # ====== ПУБЛИКАЦИЯ РЕЛИЗА НА GITHUB ======
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tic-tac-toe-windows-*.exe
            tic-tac-toe-linux-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
