name: Build and Publish Desktop Releases

on:
  push:
    tags:
      - 'v*' # Сценарий запустится только при создании тега версии, например v1.0.0, v1.1.2

jobs:
  # ====== СБОРКА WINDOWS EXE ======
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh | iex"
          uv pip install --system pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed --add-data "icon.ico;." --icon "icon.ico" main.py
        # Обратите внимание: в Windows разделитель путей в --add-data это точка с запятой (;)

      - name: Compress Release Archive (ZIP)
        run: |
          powershell Compress-Archive -Path dist/main/* -DestinationPath tic-tac-toe-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: tic-tac-toe-windows.zip

  # ====== СБОРКА LINUX APPIMAGE ======
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for Tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6

      - name: Install uv and PyInstaller
        run: |
          curl -LsSf https://astral.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system pyinstaller

      - name: Build Binary with PyInstaller
        run: |
          uv run pyinstaller --noconfirm --onedir --windowed --add-data "icon.ico:." main.py

      - name: Install AppImage Tooling
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com
          sudo chmod +x /usr/local/bin/appimagetool
          # Установка linuxdeploy для сборки AppDir структуры
          sudo wget -O /usr/local/bin/linuxdeploy https://github.com
          sudo chmod +x /usr/local/bin/linuxdeploy

      - name: Create AppImage Structure
        run: |
          mkdir -p TicTacToe.AppDir
          cp -r dist/main/* TicTacToe.AppDir/

          # Создаем ярлык .desktop внутри AppDir
          echo -e "[Desktop Entry]\nName=TicTacToe\nExec=main\nIcon=icon\nType=Application\nCategories=Game;" > TicTacToe.AppDir/TicTacToe.desktop
          cp icon.ico TicTacToe.AppDir/icon.ico

          # Создаем скрипт запуска AppRun
          echo -e "#!/bin/sh\nHERE=\$(dirname \$(readlink -f \"\$0\"))\nEXEC=\"\$HERE/main\"\nexec \"\$EXEC\" \"\$@\"" > TicTacToe.AppDir/AppRun
          chmod +x TicTacToe.AppDir/AppRun

          # Собираем финальный AppImage
          # Отключаем песочницу для работы appimagetool внутри контейнера GitHub
          export APPIMAGE_EXTRACT_AND_RUN=1
          /usr/local/bin/appimagetool TicTacToe.AppDir/ tic-tac-toe-linux.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: tic-tac-toe-linux.AppImage

  # ====== ПУБЛИКАЦИЯ РЕЛИЗА НА GITHUB ======
  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ключевое разрешение, чтобы робот мог создавать релизы
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-releases@v2
        with:
          files: |
            tic-tac-toe-windows.zip
            tic-tac-toe-linux.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
